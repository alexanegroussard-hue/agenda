name: Mise à jour de Graphenda

on:
  schedule:
    - cron: "47 0 * * 0"    # chaque dimanche, 00:47 UTC (02:47 en été, 01:47 en hiver, heure de Paris)
  workflow_dispatch:         # permet de lancer la mise à jour à la main depuis l'onglet Actions
    inputs:
      only:
        description: "Lire seulement ces sources (ids séparés par des virgules, ex. tour-taxis,ixelles-expos). Vide = toutes."
        required: false
        default: ""
      force:
        description: "Relire toutes les pages, même celles qui n'ont pas changé"
        type: boolean
        default: false
      model:
        description: "Modèle Ollama (qwen2.5:7b plus fiable, qwen2.5:3b environ deux fois plus rapide)"
        required: false
        default: "qwen2.5:7b"

permissions:
  contents: write
  actions: write

concurrency:
  group: agenda-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MODEL: ${{ github.event.inputs.model || 'qwen2.5:7b' }}
      OLLAMA_MODELS: /home/runner/ollama-models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Garder le modèle en cache
        uses: actions/cache@v4
        with:
          path: /home/runner/ollama-models
          key: ollama-${{ env.MODEL }}

      - name: Installer et démarrer Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 40); do curl -s http://localhost:11434 > /dev/null && break; sleep 2; done
          ollama pull "$MODEL"

      - name: Mettre à jour events.json
        env:
          ONLY: ${{ github.event.inputs.only }}
          FORCE: ${{ github.event.inputs.force }}
        run: python scripts/update.py

      - name: Enregistrer les changements
        if: always()
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          python3 - <<'PY'
          import json, os, datetime as dt
          if os.path.exists("progress.json"):
              p = json.load(open("progress.json"))
              if p.get("state") == "running":
                  p["state"] = "stopped"
                  p["updatedAt"] = dt.datetime.now(dt.timezone.utc).isoformat(timespec="seconds")
                  json.dump(p, open("progress.json", "w"))
          PY
          for f in events.json archive.json last-run.json page-cache.json progress.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || git commit -m "Mise à jour automatique de l'agenda"
          git pull --rebase -X theirs origin main
          git push

      - name: Empêcher la désactivation automatique du workflow
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update.yml --repo "$GITHUB_REPOSITORY"
